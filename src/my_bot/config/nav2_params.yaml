# Nav2 parameters for my_bot.
#
# Derived from nav2_bringup's nav2_params.yaml (Humble 1.1.x) with this robot's
# real geometry and conservative speeds. Deltas from upstream are marked TUNED.
#
# NO amcl AND NO map_server HERE ON PURPOSE. slam_toolbox owns map -> odom and
# publishes /map; adding either of those puts a second publisher on the map ->
# odom edge and the robot's pose visibly jumps. See the FRAMES note in
# mapper_params_online_async.yaml.
#
# ---------------------------------------------------------------------------
# FOOTPRINT: base_link is NOT the centre of this robot.
#
# base_link sits on the wheel axle, but the chassis is mounted well behind it
# (chassis_joint origin is -wheel_offset_x = -0.255 in robot_core.xacro), so the
# body extends much further back than forward:
#
#     x: -0.255 (rear)  ..  +0.040 (front)     <- chassis box in base_link
#     y: +/-0.139                              <- WHEEL outer faces, not the
#                                                 0.105 chassis half-width;
#                                                 the wheels stick out
#
# With ~1 cm margin that gives the polygon below. The REAR bound is measured and
# tight. The FRONT bound is deliberately left at +0.09, well beyond the derived
# +0.040: chassis_length is still an unverified 0.295, so the front edge is the
# one number here that could move, and over-reserving in front is the safe
# direction to be wrong. Tighten it once the chassis box is measured.
#
# THE CASTER IS NOT A CONSTRAINT, checked 10 Sep. It hangs off `chassis`, not
# base_link, so its centre is at -0.255 + 0.075 = -0.180 and its forward tip at
# -0.142 -- 12 cm inside the rear bound and nowhere near the front edge. Worth
# stating because caster_wheel_offset_x reads "+0.075" and looks like a forward
# overhang until you notice its parent link.
#
# Do NOT replace this with robot_radius: a circle enclosing this shape needs
# r=0.30, roughly double the true half-width, and the robot would then refuse
# doorways it physically fits through. If you ever do switch to a circle, delete the footprint key -- when
# both are set, footprint wins and robot_radius is silently ignored.
# ---------------------------------------------------------------------------
#
# SPEEDS: max_vel_x 0.10 / max_vel_theta 0.25, with the velocity_smoother
# clamped to the same pair. These are the limits Nav2 actually drives at, and
# raising them means raising BOTH (FollowPath below and velocity_smoother at the
# bottom) plus the matching acc_lim_*, and revisiting sim_time, because the
# lookahead DISTANCE is sim_time * max_vel_x.
#
# RAISED 21 Sep from 0.055 / 0.125. 0.055 was half the speed this project
# already trusts a human with: navigation.launch.py caps teleop at 0.10 and
# calls that "the mapping speed; above it scan shear starts smearing the map",
# which is a budget that was measured rather than guessed. Nav2 had no reason
# to sit below it, and 0.055 m/s costs 18 s per metre of exploration.
#
# The YAW figure is the one to back off first if the map smears. The arithmetic
# on max_vel_theta below is arithmetic, not a measurement -- watch a wall 4 m
# away while the robot turns before trusting it.
#
# There IS one clamp downstream, added 2026-09-11 (D-18): diff_cont limits
# linear.x to 0.15 m/s and angular.z to 0.5 rad/s in config/my_controllers.yaml.
# Nav2 still never reaches it -- it exists for a human's hand on teleop -- but
# the margin is now 1.5x on linear and 2x on yaw, not the 2.7x/4x it was.
# Below it, hardware/diffdrive_serial.cpp passes commands straight to the ESP32
# and clamps nothing.
#
# CORRECTED 21 Sep: this note used to say "diff_cont sets no limits ... these
# params are the only speed limit the robot has". True when written, false since
# D-18 ten days earlier.
#
# CORRECTED 10 Sep: this note previously quoted "max_vel_x 0.22 / max_vel_theta
# 1.0" as our values. Those are UPSTREAM's defaults; the file was cut ~4x below
# them and the header was never updated. The per-key TUNED comments in
# FollowPath are the ones that were kept current -- trust the VALUES, and the
# comments sitting next to them, over this header. (Same failure as the encoder
# -split comment in ros2_control.xacro: see reference/nvme-recovery-audit.md.)
#
# RETUNED 21 Sep, throughput pass. The speeds above, plus three defects found
# while checking them against the installed dwb sources in /opt/ros/humble:
#
#   - FollowPath scored obstacles with BaseObstacle alone, which reads the cost
#     of the one cell under base_link. That is a circular-robot test. This
#     robot's inscribed radius is 0.09 -- the FRONT edge -- while it is 0.147
#     half-wide and reaches 0.265 behind base_link, so a trajectory could put a
#     rear corner 17 cm inside a wall and score clean. ObstacleFootprint now
#     runs alongside it, and inflation_radius covers the circumscribed radius.
#   - trans_stopped_velocity sat ABOVE max_vel_x again: 0.0625 against 0.055,
#     the same defect its own comment describes having fixed.
#   - progress_checker and the recovery spin were still scaled to 0.055.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_cont/odom
    # OURS, not nav2_bt_navigator's copy. Identical to upstream's tree of the
    # same name except that Spin carries time_allowance="25.0".
    #
    # Upstream leaves it at the BT port default of 10.0 s, and spin_dist 1.57
    # at behavior_server.max_rotational_vel 0.1 rad/s needs 15.7 s. The spin
    # recovery could therefore never succeed -- measured 15 Sep, four failures
    # out of four, each at exactly 10.000 s. time_allowance is a BT PORT and
    # has no parameter, so owning the XML is the only way to set it.
    # See behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml.
    default_nav_to_pose_bt_xml: $(find-pkg-share my_bot)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

# bt_navigator spawns these two internal rclcpp nodes for its action clients.
# They are separate ROS nodes with their own clocks, and nav2_bringup's
# RewrittenYaml only rewrites use_sim_time for sections that ALREADY exist in
# this file -- it does not create missing ones. Omit these and, in simulation,
# the BT's action clients run on wall time while everything else runs on
# /clock; goals then time out for no visible reason. Harmless on the real robot.
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    # TUNED: upstream 20.0. The Jetson also runs slam_toolbox and (optionally)
    # TensorRT YOLO. 10 Hz is plenty for a robot capped at 0.10 m/s -- one
    # control cycle is 1 cm of travel -- and it leaves headroom. If the
    # controller logs "control loop missed its desired rate", lower this before
    # touching anything else; after that the cheapest cut is angular_granularity
    # in FollowPath, which sets how many poses each trajectory is rasterised at.
    #
    # CORRECTED 21 Sep: this said "capped at 0.22 m/s", which is upstream's
    # figure and never ours. It survived the 10 Sep sweep that fixed the same
    # claim in the header.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # diff_cont publishes odometry on /diff_cont/odom, NOT /odom, so this must
    # be set or DWB sees no velocity feedback and believes the robot is always
    # stationary. You will not find odom_topic in nav2's reference params or in
    # controller_server.cpp: it is declared lazily by nav_2d_utils::
    # OdomSubscriber. It is honoured. Do not delete it as "not a real param".
    odom_topic: /diff_cont/odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # SCALED WITH SPEED. This asks the robot to cover 0.5 m within the
      # allowance or navigation aborts. Upstream's 10 s is sized for upstream's
      # 0.22 m/s, a 2.3 s job; at 0.10 m/s the same 0.5 m takes 5.0 s.
      # Keep this >= 4x the time 0.5 m actually takes.
      #
      # 20.0 as of 21 Sep, down from the 40.0 that 0.055 m/s needed.
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # TUNED: upstream 0.25/0.25. This robot is only ~0.3 m long and is asked
      # to stop at frontier goals, where over-tight tolerances cause endless
      # nudging. Loose enough to settle, tight enough to be useful.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # --- velocity limits: see SPEEDS note at the top of this file ---
      min_vel_x: -0.025       # slow reverse allowed; the lidar is 360 deg so
                              # the costmap does see what is behind the robot.
                              # (Read "the X2" until 21 Sep -- it is an X3 Pro;
                              # the 11 Sep model correction missed this line.)
      max_vel_x: 0.10
      min_vel_y: 0.0
      max_vel_y: 0.0          # differential drive: no sideways motion, ever
      # TUNED DOWN from upstream's 1.0. This is a SLAM limit, not a comfort
      # limit: every ray in a sweep is taken at a different robot heading and
      # slam_toolbox does not deskew, so yaw rate smears the scan.
      #
      # A sweep is 86 ms, NOT the 100 ms this comment used to assume -- the SDK
      # measured 11.57 rev/s at 350 points on 11 Sep (see ydlidar.yaml), so
      # every smear figure written here before today was ~16 % pessimistic.
      # Smear on a wall 4 m away is 4 m * omega * 0.086 s:
      #
      #     1.000 rad/s -> 34 cm        0.500 -> 17 cm
      #     0.250 rad/s -> 8.6 cm       0.125 -> 4.3 cm
      #
      # The artefact is a wall drawn twice, offset, and on an 0.05 m grid it
      # starts to show once the smear is a cell or two.
      #
      # RAISED 21 Sep, 0.125 -> 0.25. Exploration is mostly turning, and at
      # 0.125 rad/s a 180 deg turn takes 25 s. 8.6 cm is under two cells; it is
      # also the first number to back off if the map starts doubling walls.
      # Lower this before you lower max_vel_x -- linear motion barely
      # contributes (0.10 m/s is 0.9 cm of shear over the same sweep).
      max_vel_theta: 0.25
      # NOT a reverse limit -- min_vel_x above is that. These three are the
      # magnitude gate in XYThetaIterator::isValidSpeed, which rejects a sample
      # only if hypot(x,y) is below min_speed_xy AND |theta| is below
      # min_speed_theta, and skips the test entirely if either is negative.
      # -0.025 read as "allow reverse" and did nothing at all. 0.0 is
      # upstream's value, has exactly the same effect, and does not imply
      # otherwise. Corrected 21 Sep.
      min_speed_xy: 0.0
      max_speed_xy: 0.10
      min_speed_theta: 0.0
      # Set to hold the RAMP TIME constant across the 21 Sep speed change, not
      # to hold the acceleration constant: 0.10 / 0.225 = 0.44 s to top speed,
      # which is what 0.055 / 0.125 gave, and 0.25 / 0.5 = 0.5 s to full yaw
      # rate, which is what 0.125 / 0.25 gave. Anything sharper is a snap that
      # breaks the wheels loose, and slipped wheels are encoder counts with no
      # ground motion -- odom error no amount of scan matching can predict
      # (D-23, scripts/slip_check.py).
      #
      # THESE DO NOT LIMIT WHAT DWB COMMANDS. With the default
      # StandardTrajectoryGenerator the sampling window is what is reachable
      # within sim_time, not within one control period, and sim_time * acc_lim
      # = 0.675 m/s dwarfs the whole velocity range -- so every cycle samples
      # the full [min_vel_x, max_vel_x] and DWB can, and does, command a step
      # change. What these shape is the predicted rollout. The velocity_smoother
      # at the bottom of this file is what ramps the wire, so keep the two in
      # step or the trajectory DWB scores is not the one the robot drives.
      acc_lim_x: 0.225
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.225
      decel_lim_y: 0.0
      decel_lim_theta: -0.5
      # Sample counts, against what the wheels can actually resolve.
      # diffdrive_serial.cpp rounds EACH WHEEL INDEPENDENTLY to whole encoder
      # ticks per 30 Hz PID frame, and one tick on one wheel is 2.49 mm/s of
      # wheel speed -- 0.0025 m/s of vx, or 0.0099 rad/s of yaw. Across the
      # ranges set above that is 50 distinct vx commands and 50 distinct yaw
      # commands; sampling finer than that only scores duplicates. 20 and 40
      # both still sit under their ceiling -- checked 21 Sep, when doubling the
      # yaw range could have pushed 40 the wrong side of it, and did not.
      vx_samples: 20
      vy_samples: 1           # must be >=1 even though max_vel_y is 0
      vtheta_samples: 40
      # DWB rolls trajectories forward for this long, so the lookahead DISTANCE
      # is sim_time * max_vel_x, and ~30 cm -- about the robot's own length --
      # is the horizon this file has always aimed for. It was 1.5 s at upstream
      # 0.22 m/s, 5.0 s at 0.055, and is 3.0 s at 0.10 (21 Sep). Below about
      # 0.30 m the planner goes blind to anything past its own front bumper.
      #
      # Do not leave it high "for safety": each extra second is more poses per
      # trajectory to rasterise, and with ObstacleFootprint in the critics that
      # cost is now paid on the robot's whole outline instead of one cell.
      sim_time: 3.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      # The "is it stopped yet" threshold for rotating in place at the goal,
      # and it does nothing useful unless it sits BELOW max_vel_x. Inside
      # xy_goal_tolerance RotateToGoal has two phases: above this threshold it
      # admits only trajectories slower than the current speed, which is the
      # braking phase; below it, it rejects any trajectory with linear motion
      # at all and the robot turns on the spot.
      #
      # 0.0625 was still ABOVE max_vel_x 0.055 -- the very defect the comment
      # here claimed to have fixed, inherited from 0.25 and merely made
      # smaller. The braking phase could never run: the robot crossed into the
      # window at full speed, DWB commanded zero in one cycle, and the
      # velocity_smoother absorbed the step. Fixed 21 Sep. 0.01 is 10 % of top
      # speed, roughly one control cycle of braking from a stop.
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: True
      stateful: True
      # ObstacleFootprint is OURS (21 Sep); the rest is upstream's list in
      # upstream's order.
      #
      # BaseObstacle scores the cost of the single cell under base_link, which
      # is a CIRCULAR-robot test. Upstream gets away with it because its
      # inflation_radius 0.55 exceeds its robot_radius 0.22, so the inflation is
      # the footprint. Here the inscribed radius is 0.09 -- the FRONT edge, see
      # FOOTPRINT at the top of this file -- while the robot is 0.147 half-wide
      # and reaches 0.265 behind base_link. Cells were only ever marked
      # INSCRIBED within 0.09 m of an obstacle, so a trajectory that put a rear
      # corner 17 cm inside a wall scored clean, and nothing downstream
      # re-checks it: navfn plans on cost, not on the polygon.
      #
      # BOTH are kept. ObstacleFootprint rasterises the footprint BORDER only
      # (its own header says so, and says that is valid "if the obstacles in
      # the local costmap are inflated" -- the other half of why
      # inflation_radius moved to 0.32), so the cheap centre-cell test still
      # covers anything strictly inside the polygon.
      #
      # LAST in the list on purpose: it is the expensive critic, and with
      # short_circuit_trajectory_evaluation above, a trajectory the path
      # critics have already ruled out never reaches it.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist", "ObstacleFootprint"]
      BaseObstacle.scale: 0.02
      # 0.4, NOT 0.02, to weigh the same as the BaseObstacle line above:
      # ObstacleFootprintCritic overrides getScale() to return
      # costmap_resolution * scale (0.05 * 0.4 = 0.02); BaseObstacleCritic does
      # not override it at all. Copying 0.02 across would have been a 20x cut.
      # Neither scale affects collision REJECTION, which is an exception thrown
      # out of scorePose and cannot be weighted away.
      ObstacleFootprint.scale: 0.4
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # See FOOTPRINT note at the top of this file before editing.
      footprint: "[[0.09, 0.147], [0.09, -0.147], [-0.265, -0.147], [-0.265, 0.147]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # CORRECTED 2026-09-11 from 12.0 / 10.0, which both exceeded the
          # sensor. The lidar is a YDLidar X3 Pro rated to 8.0 m, not the X2
          # every config claimed; it returns 0.0 beyond its reach and 0.0 is
          # indistinguishable from a dropout, so the costmap was being told to
          # trust and clear ranges the hardware cannot see.
          #
          # obstacle stays below raytrace, as it was before (10/12 -> 6.5/8):
          # clear stale obstacles out to the sensor's limit, but only MARK
          # within the range where the beam is still dense. At 8 m the 1.032
          # deg ray spacing is 14 cm, so a chair leg falls between rays.
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # TUNED: upstream 0.55, which on a 0.29 m robot leaves almost no clear
        # lane through a typical 0.8 m doorway.
        #
        # RAISED 21 Sep, 0.25 -> 0.32, to just clear the CIRCUMSCRIBED radius
        # hypot(0.265, 0.147) = 0.303 (the r=0.30 circle the FOOTPRINT note at
        # the top refuses to navigate with, which is still the right figure for
        # deciding how far to inflate). Below that the inflated band did not
        # reach the corners of the robot it exists to protect, and
        # ObstacleFootprint's border test assumes it does -- see the critics
        # list in FollowPath. 0.25 was picked against the 0.147 half-width
        # alone and forgot that base_link is not the centre of this robot.
        #
        # This does NOT narrow a doorway. Only cells inside the inscribed
        # radius read as lethal to the planner, and that band comes from the
        # footprint (0.09, plus nav2's default footprint_padding of 0.01), not
        # from this number. A 0.8 m doorway keeps a 0.6 m plannable lane.
        inflation_radius: 0.32
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # See FOOTPRINT note at the top of this file before editing.
      footprint: "[[0.09, 0.147], [0.09, -0.147], [-0.265, -0.147], [-0.265, 0.147]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # slam_toolbox republishes the whole /map every map_update_interval
        # (2.0 s), latched. The costmap grows with it, so the global plan can
        # reach into space that did not exist when navigation started -- which
        # is exactly what frontier exploration depends on.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # CORRECTED 2026-09-11 from 12.0 / 10.0, which both exceeded the
          # sensor. The lidar is a YDLidar X3 Pro rated to 8.0 m, not the X2
          # every config claimed; it returns 0.0 beyond its reach and 0.0 is
          # indistinguishable from a dropout, so the costmap was being told to
          # trust and clear ranges the hardware cannot see.
          #
          # obstacle stays below raytrace, as it was before (10/12 -> 6.5/8):
          # clear stale obstacles out to the sensor's limit, but only MARK
          # within the range where the beam is still dense. At 8 m the 1.032
          # deg ray spacing is 14 cm, so a chair leg falls between rays.
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Same 0.32 as the local costmap, and for the same reason -- see the
        # note there. Raised 21 Sep. Keep the two equal: a global plan drawn
        # against a different inflation than the one the controller scores
        # against is a plan DWB will fight.
        inflation_radius: 0.32
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # TUNED: upstream false. MUST stay true for exploration -- frontier goals
      # sit on the boundary between known and unknown, so with allow_unknown
      # false every single explore_lite goal is rejected as unplannable and the
      # robot just sits there.
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Recovery rotation speed. Kept below DWB's max_vel_theta so a recovery
    # spin is never the fastest the robot ever moves -- which matters more than
    # it looks: recoveries fire exactly when the map is already confused, and a
    # fast recovery spin is the single worst thing for scan matching. See the
    # deskew note on max_vel_theta above.
    #
    # RAISED 21 Sep, 0.1 -> 0.2, holding that 0.8 ratio to DWB's new 0.25. A
    # 1.57 rad spin now takes 7.9 s instead of 15.7. The BT still passes
    # time_allowance="25.0" (see bt_navigator at the top); that was sized for
    # the slow spin, so it is now slack rather than a close fit, which is the
    # safe direction. Do NOT re-tighten it towards the port default of 10.0 --
    # that is what failed four spins out of four on 15 Sep.
    max_rotational_vel: 0.2
    min_rotational_vel: 0.05
    # Same 0.4 s ramp as before (0.2 / 0.5), matched to FollowPath's
    # acc_lim_theta so a recovery spin and a planned turn break the wheels
    # loose at the same rate. Recoveries bypass the velocity_smoother, so on
    # this path it is the only acceleration limit there is.
    rotational_acc_lim: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Must not exceed DWB's limits above, or the smoother would hand the ESP32
    # a faster command than the planner ever asked for. Raised 21 Sep with
    # them.
    #
    # These four lines are what actually ramps the robot: DWB samples the full
    # velocity range every cycle and its acc_lim_* only shape the trajectory it
    # PREDICTS (see the note there), so a step command out of the controller is
    # normal and this is what turns it into a ramp.
    max_velocity: [0.10, 0.0, 0.25]
    min_velocity: [-0.025, 0.0, -0.25]
    max_accel: [0.225, 0.0, 0.5]
    max_decel: [-0.225, 0.0, -0.5]
    odom_topic: "/diff_cont/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
