controller_manager:
  ros__parameters:
    update_rate: 30

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster


diff_cont:
  ros__parameters:
    # CAPPED BY update_rate ABOVE. diff_drive_controller cannot publish faster
    # than the controller_manager ticks, so the real /diff_cont/odom and TF rate
    # is 30 Hz, not 50 -- measured 9 Sep. The 50 is harmless but do not trust it
    # as documentation: raising it changes nothing, and raising update_rate to
    # match would break the firmware's PID frame (see loop_rate in
    # description/ros2_control.xacro).
    publish_rate: 50.0
    base_frame_id: base_link

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # Must equal 2 * wheel_offset_y in description/robot_core.xacro.
    #
    # Recovered value was 0.25, measured contact-patch to contact-patch. This
    # 0.25168 was applied by hand on 9 Sep and ITS PROVENANCE IS NOT RECORDED --
    # it is not the 0.25154 the one logged spin run implies, and the direction
    # of that run was never noted. See records/calibration.md.
    #
    # NOTE the straight-line run of 9 Sep does NOT test this number. In a spin
    # the wheels counter-rotate, so a per-wheel radius error cancels in yaw and
    # only the separation shows; driving straight they co-rotate, so the
    # difference shows and the separation does not. Separation is a spin
    # measurement only.
    wheel_separation: 0.25168
    # MEASURED: 68 mm loaded diameter. THIS is the copy that scales odometry --
    # diff_drive_controller reads it from here, not from the URDF. Keep it equal
    # to wheel_radius in description/robot_core.xacro or sim and real diverge.
    #
    # NOT changed on 9 Sep, deliberately. A 3 m run measured odom over-reporting
    # by 0.17 % (5.2 mm), which would give 0.03264 -- but the distance was
    # counted as 5 floor tiles at a nominal 600 mm, and real tile pitch with
    # grout varies by several mm per tile. The uncertainty in the measurement is
    # larger than the correction it suggests, so applying it would be recording
    # noise as a calibration. Re-derive over a longer taped run if the map scale
    # ever looks wrong.
    wheel_radius: 0.0327

    # PER-SIDE RADIUS CORRECTION -- measured 2026-09-09, calibrate_straight.py
    # 3 m closed loop then calibrate_correct.py --floor-lateral.
    #
    # The loop steers on ODOM lateral offset and ODOM yaw, so it drives odom's
    # ESTIMATE of the path straight. Odom reported 0.9 mm of lateral drift; the
    # robot finished 10.9 cm RIGHT of the line, heading turned the same way.
    # That gap is pure odometry bias: 4.07 deg of uncorrected yaw over 3 m,
    # k_r - k_l = -0.005964, a 0.60 % asymmetry.
    #
    # It goes here rather than in enc_counts_per_rev_* because counts per rev is
    # a property of the encoder disc and the gearbox, and both sides are the
    # same parts -- only tyre diameter can differ between wheels. Same reasoning
    # that rejected the old l:2473 r:2556 split. DO NOT also apply the
    # equivalent correction to enc_counts_per_rev_*; it is one or the other.
    #
    # diff_drive_controller applies these to the wheel COMMANDS as well as to
    # odometry, so the robot physically drives straighter, not just reports
    # better. Verify by re-running: floor lateral should collapse below 1 cm.
    left_wheel_radius_multiplier: 1.002982
    right_wheel_radius_multiplier: 0.997018

    use_stamped_vel: false

