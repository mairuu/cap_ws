controller_manager:
  ros__parameters:
    update_rate: 30

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster


diff_cont:
  ros__parameters:
    # CAPPED BY update_rate ABOVE. diff_drive_controller cannot publish faster
    # than the controller_manager ticks, so the real /diff_cont/odom and TF rate
    # is 30 Hz, not 50 -- measured 9 Sep. The 50 is harmless but do not trust it
    # as documentation: raising it changes nothing, and raising update_rate to
    # match would break the firmware's PID frame (see loop_rate in
    # description/ros2_control.xacro).
    publish_rate: 50.0
    base_frame_id: base_link

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # Must equal 2 * wheel_offset_y in description/robot_core.xacro.
    #
    # Recovered value was 0.25, measured contact-patch to contact-patch.
    #
    # PROVENANCE RECOVERED 10 Sep -- this was flagged as unrecorded and it is
    # not. calibrate_correct.py computes new_sep = sep * odom/(odom + residual),
    # which is one-parameter, so the installed value can be inverted:
    #
    #     0.25 * 3600.32 / (3600.32 - 24.0) = 0.2516777  -> 0.25168  (installed)
    #     0.25 * 3600.32 / (3600.32 - 22.0) = 0.2515370  -> 0.25154  (in STATE)
    #
    # Same 9 Sep spin run, same odom reading of 3600.32 deg, same installed
    # 0.25. The two figures differ only in the floor residual being read as
    # -24 deg when the value was applied and -22 deg when it was written down.
    # Nothing else fits either number.
    #
    # KEPT AT 0.25168 rather than churned to 0.25154: the gap is 0.14 mm,
    # 0.056 %, worth 0.05 deg of yaw over a 90 deg turn and 0.20 deg over a full
    # rotation -- far below the precision of reading a chalk mark off a floor
    # after ten turns. Moving it would be recording noise as a calibration,
    # the same reason wheel_radius was left at 0.0327 on the same day.
    #
    # What IS resolved is that 0.25 is wrong: both readings put the separation
    # 0.61-0.67 % high, which is 2.2-2.4 deg of yaw error per full turn. The
    # correction is real; the fifth decimal place is not. See
    # records/calibration.md.
    #
    # NOTE the straight-line run of 9 Sep does NOT test this number. In a spin
    # the wheels counter-rotate, so a per-wheel radius error cancels in yaw and
    # only the separation shows; driving straight they co-rotate, so the
    # difference shows and the separation does not. Separation is a spin
    # measurement only.
    wheel_separation: 0.25168
    # MEASURED: 68 mm loaded diameter. THIS is the copy that scales odometry --
    # diff_drive_controller reads it from here, not from the URDF. Keep it equal
    # to wheel_radius in description/robot_core.xacro or sim and real diverge.
    #
    # NOT changed on 9 Sep, deliberately. A 3 m run measured odom over-reporting
    # by 0.17 % (5.2 mm), which would give 0.03264 -- but the distance was
    # counted as 5 floor tiles at a nominal 600 mm, and real tile pitch with
    # grout varies by several mm per tile. The uncertainty in the measurement is
    # larger than the correction it suggests, so applying it would be recording
    # noise as a calibration. Re-derive over a longer taped run if the map scale
    # ever looks wrong.
    wheel_radius: 0.0327

    # PER-SIDE RADIUS CORRECTION -- measured 2026-09-09, calibrate_straight.py
    # 3 m closed loop then calibrate_correct.py --floor-lateral.
    #
    # The loop steers on ODOM lateral offset and ODOM yaw, so it drives odom's
    # ESTIMATE of the path straight. Odom reported 0.9 mm of lateral drift; the
    # robot finished 10.9 cm RIGHT of the line, heading turned the same way.
    # That gap is pure odometry bias: 4.07 deg of uncorrected yaw over 3 m,
    # k_r - k_l = -0.005964, a 0.60 % asymmetry.
    #
    # It goes here rather than in enc_counts_per_rev_* because counts per rev is
    # a property of the encoder disc and the gearbox, and both sides are the
    # same parts -- only tyre diameter can differ between wheels. Same reasoning
    # that rejected the old l:2473 r:2556 split. DO NOT also apply the
    # equivalent correction to enc_counts_per_rev_*; it is one or the other.
    #
    # diff_drive_controller applies these to the wheel COMMANDS as well as to
    # odometry, so the robot physically drives straighter, not just reports
    # better. Verify by re-running: floor lateral should collapse below 1 cm.
    left_wheel_radius_multiplier: 1.002982
    right_wheel_radius_multiplier: 0.997018

    use_stamped_vel: false

    # HARD VELOCITY CEILING -- added 2026-09-11 (D-18). This is the LAST clamp
    # before the hardware, below twist_mux, below both teleops, below Nav2's
    # recoveries (which bypass the velocity_smoother). Until now nothing capped
    # speed during manual driving: teleop_twist_keyboard's `q` raises speed
    # 10 % per press with no ceiling, and the 10 Sep Day-3 attempt smeared on
    # straight sections after one such moment. At 0.5 m/s a scan shears 4.4 cm
    # over the 89 ms sweep; at 0.10 m/s it is 0.9 cm.
    #
    # Odometry is NOT affected: these limit the wheel COMMANDS only; odom is
    # integrated from encoder positions (position_feedback, default true;
    # open_loop, default false -- both deliberately left at defaults).
    #
    # Nav2 never reaches these. velocity_smoother caps at 0.055 m/s and
    # 0.125 rad/s, behavior_server.max_rotational_vel is 0.1 rad/s, so goal
    # navigation and recoveries are unchanged. The ceiling exists for a
    # human's hand on the keyboard, not for the planner.
    #
    # min_velocity must be given explicitly: the controller refuses to apply a
    # limit with only max_velocity set ("Cannot apply velocity limits if
    # max_velocity is not specified" is the matching error for the other case).
    #
    # pose_covariance_diagonal / twist_covariance_diagonal are deliberately NOT
    # set. Nothing on this robot reads them -- slam_toolbox uses TF, Nav2
    # ignores them -- and there is no EKF because there is no IMU.
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.15
    linear.x.min_velocity: -0.15
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 0.5
    angular.z.min_velocity: -0.5

