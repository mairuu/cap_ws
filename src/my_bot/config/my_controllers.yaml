controller_manager:
  ros__parameters:
    update_rate: 30

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster


diff_cont:
  ros__parameters:
    publish_rate: 50.0
    base_frame_id: base_link

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # Must equal 2 * wheel_offset_y in description/robot_core.xacro.
    # MEASURED contact-patch to contact-patch on the real robot: 0.25 confirmed.
    wheel_separation: 0.25
    # MEASURED: 68 mm loaded diameter. THIS is the copy that scales odometry --
    # diff_drive_controller reads it from here, not from the URDF. Keep it equal
    # to wheel_radius in description/robot_core.xacro or sim and real diverge.
    wheel_radius: 0.0327

    use_stamped_vel: false
