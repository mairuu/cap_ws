# YDLidar X3 Pro driver config for the real robot.
#
# MODEL CORRECTED 2026-09-11. Every document in this project said "X2" until
# today; the unit is an X3 Pro, confirmed off the label. The SDK cannot tell you
# this -- its YDLIDAR_MODLES enum contains no X2 and no X3 at all (X4 is the
# only X-series entry), and the `Fail to get baseplate device information!`
# error on every startup is exactly why: single-channel units do not answer the
# device-info query, so di.model is never populated. There is no software route
# to the model. Read the label.
#
# Upstream's X2.yaml and X3.yaml are byte-identical apart from key ordering, so
# none of the transport settings below change with the model. What DOES change
# is the physical spec: range and sample rate. Both were wrong here.
#
# Copied from ~/dev_ws/src/ydlidar_ros2_driver/params/ydlidar.yaml, which is
# the standalone setup that was bench-tested. cap_ws owns this copy so the
# workspace is self-contained; do not point real_robot.launch.py back at the
# driver package's own params, or a driver upgrade silently retunes the robot.
#
# The driver publishes /scan with BEST_EFFORT reliability (sensor data QoS).
# Subscribers must match -- a default RELIABLE subscription is QoS-incompatible
# and receives nothing at all, with no error on either side.
#
# `port` is overridden from the launch file; the value here is only the
# fallback. /dev/ydlidar is the udev symlink installed by scripts/setup_udev.sh
# -- do not put a raw ttyUSB* here, the ESP32 competes for those numbers.
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_frame        # must match laser_frame in description/lidar.xacro
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    isSingleChannel: true
    intensity_bit: 0
    intensity: false
    # 4, not upstream's 3. The X3 Pro samples at ~4K; X2/X3 are 3K, and 3 was
    # inherited along with the wrong model name.
    #
    # This parameter is INERT on a single-channel unit -- the SDK measures the
    # rate at startup and overwrites whatever is configured (CYdLidar.cpp
    # calcSampleRate, reached because the device-info query fails). It is set
    # correctly anyway because it is the number a human reads when reasoning
    # about ray counts, and 3K would give 3000/11.57 = 259 points per rev
    # against the 350 actually delivered.
    #
    # MEASURED 2026-09-11: the SDK printed "Sample Rate: 4.57K". Subtract the
    # +0.5 rounding term the code adds (m_SampleRate = count/scan_time/1000
    # + 0.5) for a true ~4.07K. Cross-checks against the scan: 350 points/rev
    # x 11.57 rev/s = 4050/s.
    sample_rate: 4
    abnormal_check_count: 4
    fixed_resolution: true
    # TRUE: the puck is mounted with its 0 degree reference pointing at the
    # BACK of the robot, so the raw bearings are 180 degrees out. This makes
    # the SDK apply `angle = angle + pi` (CYdLidar.cpp, "Rotate 180 degrees or
    # not"), which runs BEFORE the `inverted` mirror below -- so the two flags
    # are independent: this one rotates, that one changes handedness.
    #
    # With this false the whole scan is rotated by pi: a feature at the robot's
    # front-right is drawn at its back-left. Unlike a mirrored scan this stays
    # world-fixed while the robot turns in place, so
    # scripts/check_scan_world_fixed.py CANNOT catch it -- it only tests
    # rotation. It breaks on TRANSLATION instead: the error is a reflection
    # through the lidar centre, and that centre moves with the robot, so
    # driving forward makes the map smear and slam_toolbox loses the match.
    #
    # Simulation is unaffected: Gazebo's gpu_lidar is mounted in the URDF at
    # laser_frame with identity rotation, so sim needs no equivalent. Do NOT
    # "fix" this by yawing laser_joint in description/lidar.xacro -- that file
    # is shared with sim and would break the sim scan instead.
    # VERIFIED ON THIS BOARD 2026-09-11 with scripts/check_scan_bearing.py:
    # an object placed in FRONT of the robot read +1.5 / -0.5 / +2.6 deg, i.e.
    # ~0 deg. A wrong reversion would have put it at 180. Measured, not
    # inherited -- this is the first check of either flag on this hardware.
    reversion: true
    # TRUE, and it must stay true. The X3 Pro reports ray angles increasing
    # CLOCKWISE; ROS (REP-103) requires counter-clockwise-positive. This flag
    # makes the SDK apply `angle = 2*pi - angle` (CYdLidar.cpp, "Is it counter
    # clockwise"), converting to the ROS convention.
    #
    # With this false the scan is MIRRORED, and the failure does not look like
    # a mirror: a wrong-handed scan counter-rotates at TWICE the robot's yaw
    # rate once TF places it in odom, because a feature that belongs at bearing
    # b is emitted at -(b - yaw) and so lands at 2*yaw - b. Driving straight
    # looks nearly fine; the moment you rotate, the world spins and
    # slam_toolbox can never match consecutive scans, so the map stays almost
    # empty and map->odom sits at exactly identity.
    #
    # Gazebo's gpu_lidar is counter-clockwise natively, so SIMULATION NEVER
    # SHOWS THIS -- it is a real-robot-only failure. Verify after any change
    # with scripts/check_scan_world_fixed.py: turn 90 degrees and the scan must
    # still overlap itself in the odom frame.
    # VERIFIED ON THIS BOARD 2026-09-11, same script and session: an object at
    # the robot's LEFT read +91.3 / +89.2 deg. A wrong inverted would have
    # mirrored it to -90.
    inverted: true
    auto_reconnect: true
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    # 8.0, the X3 Pro's rated maximum. It was 12.0, inherited with the wrong
    # model name, and that error was NOT harmless: the hardware returns 0.0
    # for anything it cannot reach, 0.0 is indistinguishable from a true
    # dropout, and declaring 12 m meant every bearing with nothing inside 8 m
    # was counted as a dropout inside the declared range. That is the direct
    # cause of the dropout asymmetry recorded on 9 and 10 Sep -- see
    # records/calibration.md.
    #
    # MEASURED, so the claim above is bounded honestly: an A/B in one spot on
    # 11 Sep gave 19.0% dropout at range_max 8.0 against 19.5% at 12.0. In THIS
    # room the change is worth nothing, because nothing in it is further than
    # 6.3 m and so no bearing ever fell in the 8-12 m band. The correction is
    # about being right where it matters -- a corridor, or the far wall of a
    # larger room -- not about this measurement.
    #
    # Anything downstream that declares a range must not exceed this:
    # mapper_params_online_async.yaml max_laser_range and nav2_params.yaml
    # raytrace/obstacle_max_range are all pinned to it.
    range_max: 8.0
    # 0.12, the X3 Pro's rated minimum, raised from 0.1 in the same correction.
    # Readings inside 0.12 m of laser_frame are within the robot's own
    # footprint (half-width 0.147) in any case, so this discards the robot
    # seeing itself rather than real obstacles.
    range_min: 0.12
    frequency: 10.0
    # Invalid returns come back as 0.0 rather than +inf. That is BELOW
    # range_min, so consumers that only check for inf/nan will treat dropouts
    # as obstacles 0 m away.
    #
    # The old comment here claimed "~50% of the 400 rays". Both figures were
    # wrong and neither was ever counted: it is 350 rays (the SDK prints
    # "Single Fixed Size: 350", and that is MEASURED -- the mean points per
    # revolution rounded to the nearest 10, not a configured value), and
    # dropout measured 27.9% on 9 Sep, 25.7% on 10 Sep and ~19% on 11 Sep.
    #
    # DO NOT read that downward trend as the range_max fix working. All three
    # were taken in different spots, and dropout is strongly position-dependent
    # -- the worst sector has already moved from +75 deg LEFT to -15 deg AHEAD
    # between two of them. The same-spot A/B at range_max 8.0 vs 12.0 differed
    # by 0.5 points, which is inside the per-scan spread. Position dominates;
    # only same-session A/B says anything about a parameter.
    invalid_range_is_inf: false
    debug: false
